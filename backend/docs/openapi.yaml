openapi: 3.0.3
info:
  title: Agropal API
  description: |
    OpenAPI 3.0 specification for the Agropal backend.

    Notes on response conventions (derived from the implementation):
    - `GET` endpoints return the **raw DTO** as JSON (no envelope).
    - Mutating endpoints (`POST` create, `PATCH`, `DELETE`) and every `/auth/*` endpoint return a `SuccessEnvelope` carrying a machine-readable `key` and human-readable `message` from the response registry, instead of a bare status with no body. Where a token pair is issued it is nested under the envelope's `data`.
    - Error responses are wrapped in a standard envelope (`ErrorEnvelope`).
    - All endpoints except `/auth/*` require a Bearer JWT access token.

    Auth is a two-step (email OTP) flow:
    - **Register:** `POST /auth/register` stages the account and emails a code; `POST /auth/register/verify` confirms the code, creates the user and returns a token pair.
    - **Login:** `POST /auth/login` checks the password and emails a code (no token yet); `POST /auth/login/verify` confirms the code and returns a token pair.
    - **Password reset:** `POST /auth/reset-password/request` emails a code; `POST /auth/reset-password/confirm` confirms the code and sets the new password.
    - `POST /auth/{purpose}/resend-code` re-sends a code for `purpose` `register` or `reset_password`. `login` is not resendable — call `POST /auth/login` again.
    - The verify endpoints also set an httpOnly `rid` cookie carrying the refresh token; `/auth/refresh` and `/auth/logout` read it.
  version: "1.0.0"
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Farm
  - name: Location
  - name: Product
  - name: Transaction
  - name: User
  - name: Post

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Stage a new user and email a verification code
      description: Validates the payload, stages the (password-hashed) account in Redis and emails a one-time code. No user row is created until `/auth/register/verify` succeeds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Verification code sent (`AUTH.REGISTER_SUCCESS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/register/verify:
    post:
      tags: [Auth]
      summary: Confirm the registration code and create the account
      description: On success the user is created, the email marked verified, a token pair returned in `data`, and an httpOnly `rid` cookie set.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: Email verified, token pair in `data` (`AUTH.EMAIL_VERIFIED`)
          headers:
            Set-Cookie:
              description: httpOnly `rid` refresh-token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [Auth]
      summary: Check credentials and email a login code
      description: |
        Identify the account with `email` or with `username`, not both (400 if both are sent). An unknown
        account and a wrong password give the same `AUTH.INVALID_CREDENTIALS` answer.
      description: Verifies email-or-username + password, then emails a one-time code. No token is issued here — call `/auth/login/verify` with the code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: Verification code sent (`AUTH.VERIFICATION_CODE_SENT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/login/verify:
    post:
      tags: [Auth]
      summary: Confirm the login code and issue a token pair
      description: On success a token pair is returned in `data` and an httpOnly `rid` cookie is set.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: Logged in, token pair in `data` (`AUTH.LOGIN_SUCCESS`)
          headers:
            Set-Cookie:
              description: httpOnly `rid` refresh-token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/{purpose}/resend-code:
    post:
      tags: [Auth]
      summary: Re-send a verification code
      security: []
      parameters:
        - name: purpose
          in: path
          required: true
          description: '`login` is deliberately rejected — re-call `/auth/login` instead.'
          schema:
            type: string
            enum: [register, reset_password]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Verification code sent (`AUTH.VERIFICATION_CODE_SENT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the token pair using the `rid` refresh cookie
      description: Returns a new token pair in `data`. The `rid` cookie is re-set with the new refresh token id.
      security: []
      parameters:
        - name: rid
          in: cookie
          required: true
          description: httpOnly refresh token cookie set by the verify endpoints
          schema:
            type: string
      responses:
        '200':
          description: New token pair, returned in `data` (`AUTH.REFRESH_SUCCESS`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/reset-password/request:
    post:
      tags: [Auth]
      summary: Email a password-reset code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Reset code sent (`AUTH.PASSWORD_RESET_EMAIL_SENT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/reset-password/confirm:
    post:
      tags: [Auth]
      summary: Confirm the reset code and set a new password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password reset (`AUTH.PASSWORD_RESET_SUCCESS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke the refresh token
      description: Deletes the refresh-token row and clears the `rid` cookie.
      security: []
      parameters:
        - name: rid
          in: cookie
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Logout successful (`AUTH.LOGOUT_SUCCESS`)
          headers:
            Set-Cookie:
              description: expired `rid` cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /farm:
    post:
      tags: [Farm]
      summary: Create a farm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmRequest'
      responses:
        '201':
          description: Farm created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FarmCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Farm]
      summary: List farms
      responses:
        '200':
          description: List of farms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FarmResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /farm/{farm_id}:
    parameters:
      - $ref: '#/components/parameters/FarmId'
    get:
      tags: [Farm]
      summary: Get a farm by ID
      responses:
        '200':
          description: Farm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Farm]
      summary: Update a farm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmRequest'
      responses:
        '200':
          description: Farm updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Farm]
      summary: Delete a farm
      responses:
        '200':
          description: Farm deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /farm/{farm_id}/location:
    parameters:
      - $ref: '#/components/parameters/FarmId'
    post:
      tags: [Location]
      summary: Create a location for a farm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '201':
          description: Location created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LocationCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Location]
      summary: List location for a farm
      responses:
        '200':
          description: List of location
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /farm/{farm_id}/location/{location_id}:
    parameters:
      - $ref: '#/components/parameters/FarmId'
      - name: location_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Location]
      summary: Update a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          description: Location updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Location]
      summary: Delete a location
      responses:
        '200':
          description: Location deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /farm/{farm_id}/product:
    parameters:
      - $ref: '#/components/parameters/FarmId'
    post:
      tags: [Product]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Product]
      summary: List products (with stocks and prices) for a farm
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /farm/{farm_id}/product/{product_id}:
    parameters:
      - $ref: '#/components/parameters/FarmId'
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Product]
      summary: Get a product (with stocks and prices)
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Product]
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Product]
      summary: Delete a product
      responses:
        '200':
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /farm/{farm_id}/product/{product_id}/price:
    parameters:
      - $ref: '#/components/parameters/FarmId'
      - $ref: '#/components/parameters/ProductId'
    post:
      tags: [Product]
      summary: Add a price entry to a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPriceRequest'
      responses:
        '201':
          description: Price entry created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PriceCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /farm/{farm_id}/product/{product_id}/price/{price_id}:
    parameters:
      - $ref: '#/components/parameters/FarmId'
      - $ref: '#/components/parameters/ProductId'
      - name: price_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Product]
      summary: Delete a product price entry
      responses:
        '200':
          description: Price entry deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /farm/{farm_id}/product/{product_id}/stock:
    parameters:
      - $ref: '#/components/parameters/FarmId'
      - $ref: '#/components/parameters/ProductId'
    post:
      tags: [Product]
      summary: Add a stock movement entry to a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductStockRequest'
      responses:
        '201':
          description: Stock entry created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StockCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /farm/{farm_id}/product/{product_id}/stock/{stock_id}:
    parameters:
      - $ref: '#/components/parameters/FarmId'
      - $ref: '#/components/parameters/ProductId'
      - name: stock_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Product]
      summary: Delete a product stock entry
      responses:
        '200':
          description: Stock entry deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /farm/{farm_id}/transaction:
    parameters:
      - $ref: '#/components/parameters/FarmId'
    get:
      tags: [Transaction]
      summary: List all transactions for a farm (across all products)
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /farm/{farm_id}/product/{product_id}/transaction:
    parameters:
      - $ref: '#/components/parameters/FarmId'
      - $ref: '#/components/parameters/ProductId'
    post:
      tags: [Transaction]
      summary: Create one or more transactions for a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionsRequest'
      responses:
        '201':
          description: Transaction(s) created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TransactionsCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Transaction]
      summary: List transactions for a product
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Transaction]
      summary: Delete transactions for a product by ID list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTransactionsRequest'
      responses:
        '200':
          description: Transactions deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /farm/{farm_id}/product/{product_id}/transaction/{transaction_id}:
    parameters:
      - $ref: '#/components/parameters/FarmId'
      - $ref: '#/components/parameters/ProductId'
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Transaction]
      summary: Get a single transaction
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Transaction]
      summary: Update a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /transaction:
    delete:
      tags: [Transaction]
      summary: Delete transactions by ID list (across farms/products)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTransactionsRequest'
      responses:
        '200':
          description: Transactions deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transaction/all:
    delete:
      tags: [Transaction]
      summary: Delete all transactions owned by the requesting user
      responses:
        '200':
          description: All transactions deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [User]
      summary: Get a user by ID (use `me` for the current user)
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [User]
      summary: Update a user's name/avatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [User]
      summary: Delete a user (soft by default)
      parameters:
        - name: permanent
          in: query
          required: false
          description: '"true" for a hard delete, "false" or omitted for a soft delete'
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/{user_id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [User]
      summary: Change a user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [User]
      summary: List users associated with an asset
      parameters:
        - name: asset_type
          in: query
          required: true
          schema:
            type: string
            enum: [User, Farm, Product, Post, Comment]
        - name: asset_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /post:
    post:
      tags: [Post]
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PostCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Post]
      summary: List posts
      parameters:
        - name: slug
          in: query
          description: Matches posts whose slug contains this text
          schema:
            type: string
        - name: q
          in: query
          description: Matches posts whose title or content contains this text, ignoring case
          schema:
            type: string
        - name: user_id
          in: query
          description: Only posts by this author. Repeat the parameter to allow several authors.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: limit
          in: query
          description: Page size. Defaults to 20 and is capped at 100 when `limit` or `offset` is sent.
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
        - name: sort_column
          in: query
          description: Needs `sort_dir` as well. Defaults to newest first.
          schema:
            type: string
            enum: [created_at, updated_at, title, like_count, dislike_count, view_count, comment_count]
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: List of posts
          headers:
            X-Total-Count:
              description: How many posts match the filters, ignoring `limit` and `offset`
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /post/authors:
    get:
      tags: [Post]
      summary: List everyone who has written a post
      description: For building an author filter. Only names are exposed.
      responses:
        '200':
          description: Authors, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostAuthorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /post/{post_id}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Post]
      summary: Get a post with its comments
      description: Every comment on the post, replies included, oldest first. Replies point at their parent through `parent_id`.
      responses:
        '200':
          description: Post detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /post/{post_id}/comment:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      tags: [Post]
      summary: Comment on a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CommentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /post/{post_id}/engagement:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      tags: [Post]
      summary: Like, dislike or view a post
      description: |
        A user has at most one like or dislike per post: sending the other one switches it, and sending
        the same one again changes nothing. Views are not reactions; each one is counted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostEngagementRequest'
      responses:
        '201':
          description: Engagement recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Post]
      summary: Take back your like or dislike on a post
      description: Views are not affected. Having no reaction to take back is not an error.
      responses:
        '200':
          description: Reaction removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /comment/{comment_id}/engagement:
    parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Post]
      summary: Like, dislike or view a comment
      description: |
        A user has at most one like or dislike per comment: sending the other one switches it, and
        sending the same one again changes nothing. Views are not reactions; each one is counted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostEngagementRequest'
      responses:
        '201':
          description: Engagement recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Post]
      summary: Take back your like or dislike on a comment
      description: Views are not affected. Having no reaction to take back is not an error.
      responses:
        '200':
          description: Reaction removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FarmId:
      name: farm_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      description: A UUID, or the literal string "me" for the authenticated user
      schema:
        type: string
    PostId:
      name: post_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      properties:
        info:
          type: object
          properties:
            code:
              type: integer
            key:
              type: string
            message:
              type: string
        errors:
          type: array
          items:
            type: string
          nullable: true
        request_id:
          type: string

    FarmCreated:
      type: object
      properties:
        farm_id:
          type: string
          format: uuid

    LocationCreated:
      type: object
      properties:
        location_id:
          type: string
          format: uuid

    ProductCreated:
      type: object
      properties:
        product_id:
          type: string
          format: uuid

    PriceCreated:
      type: object
      properties:
        price_id:
          type: string
          format: uuid

    StockCreated:
      type: object
      properties:
        stock_id:
          type: string
          format: uuid

    TransactionsCreated:
      type: object
      description: The new transactions' ids, in the order they were sent
      properties:
        transaction_ids:
          type: array
          items:
            type: string
            format: uuid

    PostCreated:
      type: object
      properties:
        post_id:
          type: string
          format: uuid
        slug:
          type: string

    CommentCreated:
      type: object
      properties:
        comment_id:
          type: string
          format: uuid

    SuccessEnvelope:
      type: object
      properties:
        info:
          type: object
          properties:
            code:
              type: integer
            key:
              type: string
            message:
              type: string
        data:
          nullable: true
        request_id:
          type: string

    # ---- Auth ----
    UserRequest:
      type: object
      description: Used for both register (name/email/username/password required) and login (email or username + password).
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        avatar:
          type: string
        password:
          type: string
          format: password

    VerificationRequest:
      type: object
      description: Confirms a one-time code emailed by register/login. Backs `/auth/register/verify` and `/auth/login/verify`.
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmRequest:
      type: object
      required: [email, code, new_password]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
        new_password:
          type: string
          format: password

    TokenPair:
      type: object
      description: The access token only; the refresh token is set as the httpOnly `rid` cookie and never appears in the body. The field name keeps the Go capitalization.
      properties:
        AccessTokenStr:
          type: string

    # ---- Farm ----
    FarmRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    FarmResponse:
      type: object
      properties:
        farm_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string

    # ---- Location ----
    LocationRequest:
      type: object
      properties:
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double

    LocationResponse:
      type: object
      properties:
        location_id:
          type: string
          format: uuid
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double

    # ---- Product ----
    ProductRequest:
      type: object
      description: On create, name/description/image/unit are all required. On update, any subset may be provided.
      properties:
        name:
          type: string
        description:
          type: string
        image:
          type: string
        unit:
          type: string
          maxLength: 50
          description: What the product is sold by, e.g. `kg` or `pcs`

    ProductResponse:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        farm_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        image:
          type: string
        unit:
          type: string

    ProductPriceRequest:
      type: object
      required: [date_added, price, currency]
      properties:
        date_added:
          type: string
          format: date-time
        price:
          type: number
          format: double
        currency:
          type: string
          description: ISO 4217 code, e.g. `USD`

    ProductPriceResponse:
      type: object
      properties:
        price_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        date_added:
          type: string
          format: date-time
        price:
          type: number
          format: double
        currency:
          type: string

    ProductStockRequest:
      type: object
      required: [date_added, type, stock]
      properties:
        date_added:
          type: string
          format: date-time
        type:
          type: string
          enum: [INCOME, EXPENSE]
        stock:
          type: number
          format: double

    ProductStockResponse:
      type: object
      properties:
        stock_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        date_added:
          type: string
          format: date-time
        type:
          type: string
          enum: [INCOME, EXPENSE]
        stock:
          type: number
          format: double

    ProductDetailResponse:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/ProductResponse'
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/ProductStockResponse'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/ProductPriceResponse'

    # ---- Transaction ----
    TransactionRequest:
      type: object
      properties:
        date:
          type: string
          format: date-time
        type:
          type: string
          enum: [INCOME, EXPENSE]
        amount:
          type: number
          format: double
        currency:
          type: string
          description: ISO 4217 code, e.g. `USD`
        description:
          type: string

    CreateTransactionsRequest:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRequest'

    DeleteTransactionsRequest:
      type: object
      properties:
        transaction_ids:
          type: array
          items:
            type: string
            format: uuid

    TransactionResponse:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        type:
          type: string
          enum: [INCOME, EXPENSE]
        amount:
          type: number
          format: double
        currency:
          type: string
        description:
          type: string

    # ---- User ----
    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        avatar:
          type: string

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password

    UserResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        avatar:
          type: string
        role:
          type: string
          enum: [ADMIN, USER, GUEST]

    # ---- Post ----
    PostRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string

    PostCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: The comment being answered, which must be on the same post. Omit for a top-level comment.

    PostEngagementRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [LIKE, DISLIKE, VIEW]

    PostResponse:
      type: object
      properties:
        post_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        slug:
          type: string
        like_count:
          type: integer
        dislike_count:
          type: integer
        view_count:
          type: integer
        comment_count:
          type: integer
        author_name:
          type: string
        viewer_reaction:
          type: string
          enum: [LIKE, DISLIKE]
          description: The requester's own reaction. Only present when they reacted, and only on `GET /post/{post_id}`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    PostCommentResponse:
      type: object
      properties:
        comment_id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        content:
          type: string
        reply_count:
          type: integer
        like_count:
          type: integer
        dislike_count:
          type: integer
        view_count:
          type: integer
        author_name:
          type: string
        viewer_reaction:
          type: string
          enum: [LIKE, DISLIKE]
          description: The requester's own reaction. Only present when they reacted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    PostAuthorResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string

    PostDetailResponse:
      type: object
      properties:
        post:
          $ref: '#/components/schemas/PostResponse'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/PostCommentResponse'
