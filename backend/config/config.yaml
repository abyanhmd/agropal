stage: "dev"
server:
  host: "0.0.0.0"
  port: 8080
  # CIDRs / IPs of reverse proxies allowed to set X-Forwarded-For. Leave
  # empty when the server is reached directly. In production (Caddy) the proxy
  # sits on the compose bridge network, see deploy/config.prod.yaml, e.g.:
  # trusted_proxies: ["172.16.0.0/12"]
  trusted_proxies: []
cors:
  # Browser origins (scheme+host+port) allowed to call the API with
  # credentials, e.g. "https://app.example.com", "http://localhost:5173".
  # "*" reflects any origin — dev only, since it still enables credentials.
  # Empty blocks browser cross-origin calls; native/mobile and
  # server-to-server clients send no Origin and are unaffected.
  allowed_origins: ["http://localhost:3000"]
path:
  migration: "internal/migration"
  log: "logs"